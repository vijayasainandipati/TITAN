version: '3.8'

services:
  titan-backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: titan-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  titan-dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: titan-dashboard
    ports:
      - "5173:80"
    depends_on:
      - titan-backend
    restart: unless-stopped
